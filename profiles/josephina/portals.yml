# Josephina Kaiser — Portal Scanner Configuration
# Design Systems / UI Design Leadership
#
# Search locations: Atlanta/GA + Germany + Remote
# To disable a company: set enabled: false
# To add a company: copy any entry and change name/careers_url

title_filter:
  positive:
    # -- Design Leadership --
    - "Design Director"
    - "Head of Design"
    - "VP of Design"
    - "VP Design"
    - "VP Product Design"
    - "Design Manager"
    - "Design Lead"
    - "Principal Designer"
    - "Staff Designer"
    - "Creative Director"
    # -- Design Systems --
    - "Design Systems"
    - "Design System"
    - "Design Ops"
    - "DesignOps"
    - "Design Technologist"
    - "Design Engineer"
    # -- UI/UX --
    - "UI Designer"
    - "UX Designer"
    - "Product Designer"
    - "Visual Designer"
    - "Interaction Designer"
    - "UI/UX"
    - "Brand Designer"
    # -- German keywords --
    - "Design"
    - "Gestaltung"
    - "UX"
    - "UI"
    - "Produktdesigner"
    - "Designleitung"
  negative:
    - "Intern"
    - "Junior"
    - "Graphic Designer"
    - "Marketing Designer"
    - "Web Designer"
    - "Interior Designer"
    - "Fashion Designer"
    - "Instructional Designer"
    - "Game Designer"
    - "Sound Designer"
    - "Industrial Designer"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "VP"
    - "Manager"

