# Josephina Kaiser — Portal Scanner Configuration
# Design Systems / UI Design Leadership
#
# Search locations: Atlanta/GA + Germany + Remote
# To disable a company: set enabled: false
# To add a company: copy any entry and change name/careers_url

title_filter:
  positive:
    # -- Design Leadership --
    - "Design Director"
    - "Head of Design"
    - "VP of Design"
    - "VP Design"
    - "VP Product Design"
    - "Design Manager"
    - "Design Lead"
    - "Principal Designer"
    - "Staff Designer"
    - "Creative Director"
    # -- Design Systems --
    - "Design Systems"
    - "Design System"
    - "Design Ops"
    - "DesignOps"
    - "Design Technologist"
    - "Design Engineer"
    # -- UI/UX --
    - "UI Designer"
    - "UX Designer"
    - "Product Designer"
    - "Visual Designer"
    - "Interaction Designer"
    - "UI/UX"
    - "Brand Designer"
    # -- German keywords --
    - "Design"
    - "Gestaltung"
    - "UX"
    - "UI"
    - "Produktdesigner"
    - "Designleitung"
  negative:
    - "Intern"
    - "Junior"
    - "Graphic Designer"
    - "Marketing Designer"
    - "Web Designer"
    - "Interior Designer"
    - "Fashion Designer"
    - "Instructional Designer"
    - "Game Designer"
    - "Sound Designer"
    - "Industrial Designer"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "VP"
    - "Manager"

# ============================================================
# SEARCH QUERIES — Atlanta/GA + Germany + Remote
# ============================================================

search_queries:

  # -- Atlanta / Georgia --
  - name: Atlanta — Design Systems Lead
    query: '"Design Systems" lead OR manager OR director Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Design Director
    query: '"Design Director" OR "Head of Design" OR "VP of Design" Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Product Designer Senior
    query: '"Senior Product Designer" OR "Staff Designer" OR "Principal Designer" Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — LinkedIn Design
    query: 'site:linkedin.com/jobs "Design Systems" OR "Design Director" OR "Head of Design" Atlanta OR Georgia'
    enabled: true

  # -- Remote --
  - name: Remote — Design Systems Lead
    query: '"Design Systems" lead OR manager OR director remote'
    enabled: true

  - name: Remote — Head of Design
    query: '"Head of Design" OR "Design Director" OR "VP of Design" remote'
    enabled: true

  - name: Remote — Principal Designer
    query: '"Principal Designer" OR "Staff Designer" "design systems" remote'
    enabled: true

  # -- Job Boards --
  - name: Greenhouse — Design Systems
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Design Systems" lead OR manager OR director'
    enabled: true

  - name: Ashby — Design Leadership
    query: 'site:jobs.ashbyhq.com "Design Director" OR "Head of Design" OR "Design Systems"'
    enabled: true

  - name: Lever — Design Leadership
    query: 'site:jobs.lever.co "Design Director" OR "Head of Design" OR "Design Systems"'
    enabled: true

  - name: Dribbble — Design Systems
    query: 'site:dribbble.com/jobs "Design Systems" OR "Design Director"'
    enabled: true

  - name: Built In — Atlanta Design
    query: 'site:builtin.com "Design" "Atlanta" lead OR director OR manager'
    enabled: true

  # -- Germany --
  - name: Germany — Design Lead
    query: '"Design Lead" OR "Head of Design" OR "Design Director" Germany OR Berlin OR Munich OR Hamburg'
    enabled: true

  - name: Germany — Design Systems
    query: '"Design Systems" OR "Design System" Germany OR Berlin OR Munich'
    enabled: true

  - name: Germany — StepStone Design
    query: 'site:stepstone.de "UX" OR "UI" OR "Design" Lead OR Director OR Head'
    enabled: true

  - name: Germany — LinkedIn Design
    query: 'site:linkedin.com/jobs "Design Director" OR "Head of Design" OR "Design Systems" Germany OR Berlin'
    enabled: true

  - name: Germany — Berlin Startup Jobs
    query: 'site:berlinstartupjobs.com "Design" lead OR director OR "design systems"'
    enabled: true

