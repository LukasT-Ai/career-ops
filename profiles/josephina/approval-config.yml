# Auto-Apply Approval Configuration -- Josephina Kaiser
# Controls how the auto-apply mode handles approval gates.

approval:
  mode: manual
  threshold: 4.5
  minimum_score: 3.5
  require_cover_letter: true
  require_cv_pdf: true
  notify_before_submit: true
  max_per_session: 10

  platforms:
    greenhouse: manual
    lever: manual
    ashby: manual
    workday: manual
    icims: manual

  salary_strategy: range
