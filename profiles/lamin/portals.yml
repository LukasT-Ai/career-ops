# Lamin Traore — Portal Scanner Configuration
# Telecom / UCaaS / Hosted Voice / Managed Services / Contact Center
#
# Search locations: Atlanta/GA + Germany (configurable in profile.yml)
# To disable a company: set enabled: false
# To add a company: copy any entry and change name/careers_url

title_filter:
  positive:
    # -- Telecom / Sales roles --
    - "Account Executive"
    - "Account Manager"
    - "Sales"
    - "Business Development"
    - "Enterprise"
    - "B2B"
    - "Channel"
    - "Partner"
    - "Solutions"
    - "Consultant"
    - "Territory"
    - "Regional"
    - "Major Account"
    - "Named Account"
    - "Strategic Account"
    - "Mid-Market"
    - "SMB"
    - "Commercial"
    # -- Telecom-specific --
    - "Telecom"
    - "UCaaS"
    - "CCaaS"
    - "SD-WAN"
    - "Managed Services"
    - "Voice"
    - "Network"
    - "Fiber"
    - "Connectivity"
    - "Wireless"
    - "5G"
    # -- German keywords --
    - "Vertrieb"
    - "Kundenberater"
    - "Außendienst"
    - "Key Account"
    - "Geschäftskunden"
  negative:
    - "Intern"
    - "Junior"
    - "Part-Time"
    - "Warehouse"
    - "Retail Store"
    - "Field Technician"
    - "Cable Installer"
    - "Line Technician"
    - "Customer Service Rep"
    - "Call Center Agent"
  seniority_boost:
    - "Senior"
    - "Director"
    - "VP"
    - "Manager"
    - "Lead"
    - "Principal"
    - "Head"

# ============================================================
# SEARCH QUERIES — Atlanta/GA + Germany + Remote
# ============================================================

search_queries:

  # -- Atlanta / Georgia --
  - name: Atlanta — Telecom Sales
    query: '"Account Executive" OR "Account Manager" telecom OR UCaaS OR "managed services" Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Enterprise Sales
    query: '"Enterprise Sales" OR "B2B Sales" OR "Business Development" telecom OR connectivity OR fiber Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Channel Sales
    query: '"Channel Manager" OR "Channel Sales" OR "Partner Manager" telecom OR UCaaS OR SD-WAN Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Solutions Consultant
    query: '"Solutions Consultant" OR "Solutions Engineer" OR "Solutions Architect" telecom OR UCaaS Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — LinkedIn Telecom
    query: 'site:linkedin.com/jobs "Account Executive" OR "Sales" telecom OR UCaaS OR "hosted voice" Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Indeed Telecom
    query: 'site:indeed.com "Account Executive" OR "Sales" telecom OR UCaaS OR fiber Atlanta GA'
    enabled: true

  # -- Germany --
  - name: Germany — Telecom Vertrieb
    query: '"Account Manager" OR "Vertrieb" OR "Key Account" Telekommunikation OR UCaaS OR "Managed Services" Germany OR Deutschland'
    enabled: true

  - name: Germany — Enterprise Sales EN
    query: '"Enterprise Sales" OR "Account Executive" telecom OR UCaaS OR SD-WAN Germany OR Berlin OR Munich OR Frankfurt'
    enabled: true

  - name: Germany — StepStone Telecom
    query: 'site:stepstone.de "Account Manager" OR "Vertrieb" OR "Key Account" Telekommunikation OR UCaaS'
    enabled: true

  - name: Germany — LinkedIn Telecom
    query: 'site:linkedin.com/jobs "Account Manager" OR "Sales" telecom OR UCaaS Germany OR Deutschland'
    enabled: true

  # -- Remote / General --
  - name: Remote — UCaaS Sales
    query: '"Account Executive" OR "Account Manager" UCaaS OR "hosted voice" OR "cloud communications" remote'
    enabled: true

  - name: Remote — SD-WAN / SASE Sales
    query: '"Account Executive" OR "Sales" SD-WAN OR SASE OR "managed network" remote'
    enabled: true

  - name: Remote — Contact Center Sales
    query: '"Account Executive" OR "Sales" CCaaS OR "contact center" OR "customer experience" remote'
    enabled: true

  - name: Greenhouse — Telecom
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Account Executive" OR "Sales" telecom OR UCaaS OR "cloud communications"'
    enabled: true

  - name: Ashby — Telecom
    query: 'site:jobs.ashbyhq.com "Account Executive" OR "Sales" telecom OR UCaaS OR "cloud communications"'
    enabled: true

  - name: Lever — Telecom
    query: 'site:jobs.lever.co "Account Executive" OR "Sales" telecom OR UCaaS OR SD-WAN'
    enabled: true

