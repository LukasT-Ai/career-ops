# Lamin Traore — Portal Scanner Configuration
# Telecom / UCaaS / Hosted Voice / Managed Services / Contact Center
#
# Search locations: Atlanta/GA + Germany (configurable in profile.yml)
# To disable a company: set enabled: false
# To add a company: copy any entry and change name/careers_url

title_filter:
  positive:
    # -- Telecom / Sales roles --
    - "Account Executive"
    - "Account Manager"
    - "Sales"
    - "Business Development"
    - "Enterprise"
    - "B2B"
    - "Channel"
    - "Partner"
    - "Solutions"
    - "Consultant"
    - "Territory"
    - "Regional"
    - "Major Account"
    - "Named Account"
    - "Strategic Account"
    - "Mid-Market"
    - "SMB"
    - "Commercial"
    # -- Telecom-specific --
    - "Telecom"
    - "UCaaS"
    - "CCaaS"
    - "SD-WAN"
    - "Managed Services"
    - "Voice"
    - "Network"
    - "Fiber"
    - "Connectivity"
    - "Wireless"
    - "5G"
    # -- German keywords --
    - "Vertrieb"
    - "Kundenberater"
    - "Außendienst"
    - "Key Account"
    - "Geschäftskunden"
  negative:
    - "Intern"
    - "Junior"
    - "Part-Time"
    - "Warehouse"
    - "Retail Store"
    - "Field Technician"
    - "Cable Installer"
    - "Line Technician"
    - "Customer Service Rep"
    - "Call Center Agent"
  seniority_boost:
    - "Senior"
    - "Director"
    - "VP"
    - "Manager"
    - "Lead"
    - "Principal"
    - "Head"

# ============================================================
# SEARCH QUERIES — Atlanta/GA + Germany + Remote
# ============================================================

search_queries:

  # -- Atlanta / Georgia --
  - name: Atlanta — Telecom Sales
    query: '"Account Executive" OR "Account Manager" telecom OR UCaaS OR "managed services" Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Enterprise Sales
    query: '"Enterprise Sales" OR "B2B Sales" OR "Business Development" telecom OR connectivity OR fiber Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Channel Sales
    query: '"Channel Manager" OR "Channel Sales" OR "Partner Manager" telecom OR UCaaS OR SD-WAN Atlanta OR Georgia'
    enabled: true

  - name: Atlanta — Solutions Consultant
