# ============================================================
# GERMANY APPROBATION PATHWAY — Reference
# ============================================================
# This section is documentation, not scanner config.
# It helps the evaluation system understand Paulina's Germany pathway.
#
# PATHWAY: Berufserlaubnis (temp license) → Work + Prepare → Kenntnisprüfung → Full Approbation
#
# REQUIREMENTS FOR APPROBATION:
#   1. Medical degree recognition (US MD evaluated vs German Staatsexamen)
#   2. Kenntnisprüfung (oral-practical exam, ~60 min)
#   3. German B2 general + C1 Fachsprachprüfung (medical German)
#   4. Certificate of Good Standing from GA + CA boards
#   5. Clean criminal record
#   6. Apply to Approbationsbehörde of target Bundesland
#   Timeline: 6-18 months | Cost: EUR 500-1,500
#
# BERUFSERLAUBNIS (FASTER ENTRY):
#   - Valid up to 2 years (renewable in some states)
#   - Restricted to specific employer + Bundesland
#   - Requires job offer from German hospital
#   - Language: B2 German (some states accept B1 initially)
#   - Can practice under supervision while preparing for Kenntnisprüfung
#   - RECOMMENDED STRATEGY: Get hired → Berufserlaubnis → Work → Kenntnisprüfung → Approbation
#
# MOST ACCESSIBLE BUNDESLÄNDER (ranked):
#   Tier 1 (highest demand, fastest processing):
#     Brandenburg, Sachsen (Dresden/Leipzig), Sachsen-Anhalt,
#     Mecklenburg-Vorpommern, Thüringen, Schleswig-Holstein
#   Tier 2 (good opportunities):
#     NRW, Niedersachsen, Hessen, Hamburg
#   Tier 3 (competitive/stricter):
#     Bayern, Baden-Württemberg, Berlin
#
# NOTE: Psychiatry is a Mangelfach (shortage specialty) across ALL of Germany.
#       This significantly improves prospects everywhere.
#
# KEY GERMAN MEDICAL JOB BOARDS:
#   - aerzteblatt.de/aerztestellen (official, most comprehensive)
#   - praktischarzt.de (modern, popular)
#   - marburger-bund.de/stellenboerse (physicians' union)
#   - stepstone.de (general, strong medical)
#   - approbatio.de (international doctor specialist)
#   - doctari.de (locum/staffing)
#   - medwing.com (healthcare staffing)
#   - kliniken.de/stellenmarkt (hospital-focused)
#   - de.indeed.com (search "Psychiater" or "Facharzt Psychiatrie")
