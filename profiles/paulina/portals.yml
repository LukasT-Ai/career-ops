# Paulina Kaiser — Portal Scanner Configuration
# Psychiatry: GA, CA, and Germany (Approbation/sponsorship pathway)
#
# Licensed in: Georgia (GA) and California (CA)
# Germany: Requires Approbation or Berufserlaubnis (temporary license)
# Search locations configurable in profile.yml
#
# To disable a company: set enabled: false
# To add a company: copy any entry and change name/careers_url

title_filter:
  positive:
    # -- Psychiatry roles (English) --
    - "Psychiatrist"
    - "Psychiatry"
    - "Behavioral Health"
    - "Mental Health"
    - "Psychiatric"
    - "Psychopharmacology"
    - "Physician"
    - "MD"
    - "Attending"
    - "Medical Director"
    - "Chief Medical Officer"
    - "Telepsychiatry"
    - "Addiction"
    - "Substance Abuse"
    - "PTSD"
    - "Forensic"
    - "Consultation-Liaison"
    - "Geriatric Psychiatry"
    - "Child Psychiatry"
    - "Prescriber"
    # -- German keywords --
    - "Psychiater"
    - "Facharzt"
    - "Fachärztin"
    - "Psychiatrie"
    - "Psychotherapie"
    - "Psychosomatik"
    - "Oberarzt"
    - "Oberärztin"
    - "Assistenzarzt"
    - "Assistenzärztin"
    - "Chefarzt"
    - "Chefärztin"
    - "Stationsarzt"
    - "Arzt"
    - "Ärztin"
    - "Klinik"
    - "Neurologie"
  negative:
    - "Nurse Practitioner"
    - "NP"
    - "PA-C"
    - "Physician Assistant"
    - "LPC"
    - "LCSW"
    - "Therapist"
    - "Counselor"
    - "Psychologist"
    - "Social Worker"
    - "Medical Assistant"
    - "Technician"
    - "CNA"
    - "RN"
    - "Registered Nurse"
    - "Krankenpfleger"
    - "Pflegekraft"
  seniority_boost:
    - "Medical Director"
    - "Chief"
    - "Director"
    - "Lead"
    - "Senior"
    - "Attending"
    - "Chefarzt"
    - "Oberarzt"
    - "Leitend"

# ============================================================
# SEARCH QUERIES — GA, CA, Germany + Telepsychiatry
# ============================================================

search_queries:

  # -- Georgia --
  - name: GA — Psychiatrist
    query: '"Psychiatrist" OR "Psychiatry" Atlanta OR Georgia -"nurse practitioner" -NP -PA'
    enabled: true

  - name: GA — Behavioral Health Physician
    query: '"Behavioral Health" physician OR "Medical Director" Atlanta OR Georgia'
    enabled: true

  - name: GA — LinkedIn Psychiatry
    query: 'site:linkedin.com/jobs "Psychiatrist" OR "Psychiatry" Georgia OR Atlanta'
    enabled: true

  - name: GA — Indeed Psychiatry
    query: 'site:indeed.com "Psychiatrist" Georgia OR Atlanta'
    enabled: true

  - name: GA — PracticeLink
    query: 'site:practicelink.com "Psychiatrist" Georgia'
    enabled: true

  # -- California --
  - name: CA — Psychiatrist
    query: '"Psychiatrist" OR "Psychiatry" California OR "Los Angeles" OR "San Francisco" OR "San Diego" -NP -PA'
    enabled: true

  - name: CA — Telepsychiatry
    query: '"Telepsychiatry" OR "Remote Psychiatrist" California'
    enabled: true

  - name: CA — LinkedIn Psychiatry
    query: 'site:linkedin.com/jobs "Psychiatrist" California OR "Los Angeles" OR "Bay Area"'
    enabled: true

  - name: CA — State Hospitals
    query: 'site:dsh.ca.gov "Psychiatrist" OR "Physician"'
    enabled: true

  # -- Remote / Telepsychiatry --
  - name: Remote — Telepsychiatrist
    query: '"Telepsychiatrist" OR "Remote Psychiatrist" OR "Virtual Psychiatrist"'
    enabled: true

  - name: Remote — Psychiatry Platform
    query: '"Psychiatrist" telehealth OR telepsychiatry OR virtual "remote" -NP -PA'
    enabled: true

  # -- Germany: Psychiatry --
  - name: DE — Facharzt Psychiatrie
    query: '"Facharzt" OR "Fachärztin" "Psychiatrie" OR "Psychiatrie und Psychotherapie"'
    enabled: true

  - name: DE — Oberarzt Psychiatrie
    query: '"Oberarzt" OR "Oberärztin" "Psychiatrie" Germany OR Deutschland'
    enabled: true

  - name: DE — Assistenzarzt Psychiatrie
    query: '"Assistenzarzt" OR "Assistenzärztin" "Psychiatrie" Germany OR Deutschland'
    enabled: true

  - name: DE — Ärztestellen Psychiatrie
    query: 'site:aerzteblatt.de "Psychiatrie" OR "Psychiater" OR "Facharzt"'
    enabled: true

  - name: DE — PraktischArzt Psychiatrie
    query: 'site:praktischarzt.de "Psychiatrie" OR "Psychiater"'
    enabled: true

  - name: DE — Marburger Bund
    query: 'site:marburger-bund.de "Psychiatrie" OR "Facharzt"'
    enabled: true

  - name: DE — StepStone Psychiatrie
    query: 'site:stepstone.de "Psychiater" OR "Facharzt Psychiatrie" OR "Oberarzt Psychiatrie"'
    enabled: true

  - name: DE — Indeed Psychiatrie
    query: 'site:de.indeed.com "Psychiater" OR "Facharzt Psychiatrie"'
    enabled: true

  - name: DE — Kliniken.de
    query: 'site:kliniken.de "Psychiatrie" "Arzt" OR "Facharzt" OR "Oberarzt"'
    enabled: true

  - name: DE — Approbation/Sponsorship
    query: '"international doctor" OR "ausländische Ärzte" OR "Approbation" psychiatry OR Psychiatrie Germany'
    enabled: true

  # -- Germany: Sponsorship-Specific --
  - name: DE — Berufserlaubnis Psychiatrie
    query: '"Berufserlaubnis" "Psychiatrie" OR "Psychiater" OR "international"'
    enabled: true

  - name: DE — International Recruitment Hospitals
    query: '"international recruitment" OR "internationale Ärzte" hospital OR Klinik psychiatry OR Psychiatrie Germany'
    enabled: true

