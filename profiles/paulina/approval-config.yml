# Auto-Apply Approval Configuration -- Paulina Kaiser
# Full auto: all qualifying jobs dispatched as notifications, no approval gates.

auto_apply_consent: true

approval:
  mode: auto
  threshold: 2.0
  minimum_score: 2.0
  require_cover_letter: true
  require_cv_pdf: true
  notify_before_submit: false
  max_per_session: 50

  platforms:
    greenhouse: auto
    lever: auto
    ashby: auto
    workday: auto
    icims: auto

  salary_strategy: range
