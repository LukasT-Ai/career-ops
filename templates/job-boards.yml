# Job Boards Registry — Career-Ops
# Central reference for all job boards, their automation capabilities, and profile relevance.
#
# Automation Tiers:
#   api        — Has a public/authenticated API. Best for automation.
#   scrape     — No API but scrape-friendly (static HTML or light JS). BeautifulSoup/Playwright.
#   assisted   — Heavy JS, aggressive bot detection, or auth walls. Playwright + human fallback.
#   manual     — No scraping possible. RSS/email alerts or manual browsing only.
#
# Profiles: paulina (psychiatry), lamin (telecom/sales), josephina (design/UI)
# "all" means the board is useful for all three profiles with different keyword filters.
#
# Integration: The scanner (modes/scan.md) uses search_queries in each profile's portals.yml
# with site: filters pointing to these boards. This file is the reference; portals.yml has the queries.

# ============================================================
# CROSS-CUTTING MEGA BOARDS (all profiles)
# ============================================================

cross_cutting:

  # --- Tier 1: API-First ---
  - name: LinkedIn Jobs
    url: linkedin.com/jobs
    tier: api
    api_endpoint: api.linkedin.com/v2/jobs
    auth: OAuth2 (paid for bulk)
    rate_limit: 100/min
    scrape: limited (blocks bots)
    robots_txt: blocks
    profiles: all
    notes: "Largest pool across all 3 categories. Use API or site: search queries. Never direct-scrape."
    automation: full_with_api
    manual_needed: "API key requires LinkedIn developer account + approval"

  - name: Indeed
    url: indeed.com
    tier: api
    api_endpoint: api.indeed.com (Publisher API)
    auth: API key
    rate_limit: 50/min
    scrape: yes (careful)
    robots_txt: blocks
    profiles: all
    notes: "Largest aggregator. API preferred. Direct scraping risks IP ban."
    automation: full_with_api
    manual_needed: "Publisher API key application required"

  - name: ZipRecruiter
    url: ziprecruiter.com
    tier: api
    api_endpoint: api.ziprecruiter.com
    auth: API key
    rate_limit: 45/min
    scrape: limited
    profiles: all
    automation: full_with_api
    manual_needed: "API key application"

  - name: CareerBuilder
    url: careerbuilder.com
    tier: api
    api_endpoint: public.api.careerbuilder.com
    auth: API key
    rate_limit: 60/min
    scrape: yes
    profiles: all
    automation: full_with_api

  # --- Tier 2: Scrape-Friendly ---
  - name: Monster
    url: monster.com
    tier: scrape
    auth: free
    rate_limit: 40/min
    scrape: yes
    profiles: all
    automation: full_scrape
    notes: "Lower quality listings but decent volume."

  - name: Glassdoor
    url: glassdoor.com
    tier: assisted
    auth: free account
    rate_limit: 30/min
    scrape: limited (blocks bots)
    robots_txt: blocks
    profiles: all
    automation: manual_preferred
    manual_needed: "Aggressive bot detection. Use for salary research, not scraping."

  - name: FlexJobs
    url: flexjobs.com
    tier: manual
    auth: paid subscription
    rate_limit: 20/min
    scrape: no
    profiles: all
    automation: manual_only
    manual_needed: "Paid subscription required. Curated remote jobs."

  - name: Remote.co
    url: remote.co
    tier: scrape
    auth: free
    rate_limit: 25/min
    scrape: limited
    profiles: all
    automation: full_scrape
    notes: "Remote-only positions."

  - name: We Work Remotely
    url: weworkremotely.com
    tier: scrape
    auth: free
    rate_limit: 35/min
    scrape: yes
    profiles: [josephina, lamin]
    automation: full_scrape

  - name: The Muse
    url: themuse.com
    tier: api
    auth: free
    rate_limit: 50/min
    scrape: limited
    profiles: all
    automation: full_with_api

  # --- Tier 3: Startup / High-Growth ---
  - name: AngelList (Wellfound)
    url: angel.co/jobs
    tier: api
    api_endpoint: api.angel.co (GraphQL)
    auth: OAuth2
    rate_limit: 75/min
    scrape: limited
    robots_txt: allows
    profiles: [lamin, josephina]
    automation: full_with_api

  - name: Y Combinator Jobs
    url: ycombinator.com/jobs
    tier: api
    auth: free
    rate_limit: 60/min
    scrape: limited
    profiles: [lamin, josephina]
    automation: full_with_api

  - name: Otta
    url: otta.com
    tier: api
    api_endpoint: GraphQL
    auth: free account
    rate_limit: 70/min
    profiles: all
    automation: full_with_api

  - name: Built In
    url: builtin.com
    tier: scrape
    auth: free
    rate_limit: 50/min
    scrape: yes
    profiles: [lamin, josephina]
    automation: full_scrape
    notes: "City-specific sub-sites (builtinchicago, builtinseattle, etc.)"

  - name: Crunchbase Jobs
    url: crunchbase.com/jobs
    tier: api
    auth: free
    rate_limit: 55/min
    profiles: [lamin, josephina]
    automation: full_with_api

  - name: ProductHunt Jobs
    url: producthunt.com/jobs
    tier: api
    auth: free
    rate_limit: 65/min
    robots_txt: allows
    profiles: [lamin, josephina]
    automation: full_with_api

  # --- ATS Platforms (used via tracked_companies) ---
  - name: Greenhouse
    url: boards.greenhouse.io
    tier: api
    api_endpoint: boards-api.greenhouse.io/v1/boards/{slug}/jobs
    auth: none (public board API)
    rate_limit: 80/min
    profiles: all
    automation: full_with_api
    notes: "Harvest API for direct company scraping. Best ATS API."

  - name: Lever
    url: jobs.lever.co
    tier: api
    api_endpoint: api.lever.co/v0/postings/{company}
    auth: none (public postings API)
    rate_limit: 75/min
    profiles: all
    automation: full_with_api

  - name: Ashby
    url: jobs.ashbyhq.com
    tier: scrape
    auth: free
    rate_limit: 60/min
    scrape: yes (React SPA, needs Playwright)
    profiles: all
    automation: full_scrape
    notes: "SPA — requires Playwright snapshot, not static scrape."

  - name: Workday
    url: "[company].wd5.myworkdayjobs.com"
    tier: assisted
    auth: free
    rate_limit: 70/min
    scrape: limited
    profiles: all
    automation: assisted_manual
    manual_needed: "Complex multi-step forms, session-based auth, varies per company."

  - name: Taleo (Oracle)
    url: "[company].taleo.net"
    tier: assisted
    auth: free
    rate_limit: 60/min
    scrape: limited
    profiles: all
    automation: assisted_manual
    manual_needed: "Legacy Oracle ATS. Slow, Java-heavy UI."

  - name: SmartRecruiters
    url: "[company].smartrecruiters.com"
    tier: api
    auth: API key
    rate_limit: 65/min
    profiles: all
    automation: full_with_api

  - name: iCIMS
    url: "[company].icims.com"
    tier: assisted
    auth: free
    rate_limit: 50/min
    profiles: all
    automation: assisted_manual
    manual_needed: "Session-heavy, multi-page forms."

  - name: BambooHR
    url: "[company].bamboohr.com/careers"
    tier: scrape
    auth: free
    rate_limit: 55/min
    profiles: all
    automation: full_scrape

